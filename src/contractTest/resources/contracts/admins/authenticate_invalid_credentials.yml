description: Unknown credentials return an empty admin with no id
request:
  method: POST
  url: /crud/admins/authenticate
  headers:
    Content-Type: application/json
  body:
    username: someone.else
    password: wrong-password
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    isActive: false
  matchers:
    body:
      - path: $.adminId
        type: by_null
