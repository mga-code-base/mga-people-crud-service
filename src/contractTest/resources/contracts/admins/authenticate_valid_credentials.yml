description: Valid admin credentials return the admin without the password hash
request:
  method: POST
  url: /crud/admins/authenticate
  headers:
    Content-Type: application/json
  body:
    username: admin.alex
    password: S3cret!pass
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    adminId: "7"
    username: admin.alex
    isActive: true
    branch: "3"
  matchers:
    body:
      - path: $.password
        type: by_null
